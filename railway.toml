# Railway — HerdShare API
#
# IMPORTANT (fixes "@herdshare/shared" build errors):
# 1. Service Root Directory must be EMPTY / repo root (not apps/api)
# 2. Settings → Build → Builder = Dockerfile
# 3. Dockerfile path = apps/api/Dockerfile

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
watchPatterns = ["apps/api/**", "packages/shared/**", "package.json", "package-lock.json"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
