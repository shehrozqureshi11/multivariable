# Render Blueprint — HerdShare API
# https://dashboard.render.com → New → Blueprint → connect this repo

services:
  - type: web
    name: herdshare-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: CORS_ORIGIN
        value: http://localhost:3000,https://multivariable-api-git-main-sheriii.vercel.app
      - key: REDIS_URL
        sync: false
