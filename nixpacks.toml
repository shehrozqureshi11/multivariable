# Fallback when Railway uses Nixpacks/Railpack instead of Dockerfile.
# Prefer Dockerfile via railway.toml for reliable monorepo builds.

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = [
  "DATABASE_URL=postgresql://build:build@localhost:5432/build npm run build -w @herdshare/shared",
  "DATABASE_URL=postgresql://build:build@localhost:5432/build npx prisma generate --schema=apps/api/prisma/schema.prisma",
  "DATABASE_URL=postgresql://build:build@localhost:5432/build npm run build -w @herdshare/api",
]

[start]
cmd = "npm run start -w @herdshare/api"

[variables]
PORT = "8080"
JWT_ACCESS_SECRET = "herdshare-prod-access-secret-change-when-possible-32"
JWT_REFRESH_SECRET = "herdshare-prod-refresh-secret-change-when-possible-32"
CORS_ORIGIN = "http://localhost:3000,https://multivariable-api-git-main-sheriii.vercel.app"
